<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f5f4f0; min-height: 100vh; padding-bottom: 64px; }

  #header { background: linear-gradient(135deg, #0f2942 0%, #1a4a7a 100%); color: #fff; padding: 24px 20px 18px; position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 16px rgba(0,0,0,0.22); }
  #header .inner { max-width: 740px; margin: 0 auto; }
  #header .subtitle { font-size: 10px; letter-spacing: 3px; opacity: 0.6; margin-bottom: 3px; text-transform: uppercase; }
  #header h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 3px; }
  #header .dates { font-size: 11px; opacity: 0.65; margin-bottom: 12px; }
  #book-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  #book-badges span { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  #progress-bar-wrap { background: rgba(255,255,255,0.12); border-radius: 99px; height: 7px; overflow: hidden; margin-bottom: 5px; }
  #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #7ee8a2, #4fc3f7); border-radius: 99px; transition: width 0.4s; }
  #progress-text { font-size: 11px; opacity: 0.8; }

  #content { max-width: 740px; margin: 0 auto; padding: 0 12px; }

  .scroll-row { display: flex; gap: 6px; padding: 12px 0 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .scroll-row::-webkit-scrollbar { display: none; }
  .filter-btn { white-space: nowrap; padding: 5px 12px; border-radius: 99px; border: 2px solid; font-weight: 700; font-size: 11px; cursor: pointer; transition: all 0.15s; background: transparent; }
  .filter-btn.active { color: #fff !important; }
  .month-btn { white-space: nowrap; padding: 5px 14px; border-radius: 99px; border: 1.5px solid #ccc; background: #fff; color: #444; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .month-btn.active { background: #0f2942; color: #fff; border-color: #0f2942; }

  /* 묶음 구분 헤더 */
  .cluster-header { margin: 18px 0 8px; padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; }
  .cluster-header .cluster-icon { font-size: 18px; }
  .cluster-header .cluster-title { font-size: 14px; font-weight: 900; }
  .cluster-header .cluster-sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }

  .day-card { margin-bottom: 8px; border-radius: 14px; overflow: hidden; border: 2px solid #e2dfd8; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.06); transition: background 0.2s; }
  .day-card.done { background: #f0faf4; border-color: #86efac; }
  .day-card.today { border-color: #f59e0b; box-shadow: 0 0 0 3px #fef3c7; }
  .day-header { padding: 9px 14px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edeae3; }
  .day-header.today-bg { background: #fffbeb; }
  .day-header.done-border { border-bottom-color: #bbf7d0; }
  .day-title { display: flex; align-items: center; gap: 7px; }
  .today-badge { font-size: 10px; font-weight: 800; background: #f59e0b; color: #fff; padding: 1px 7px; border-radius: 99px; }
  .day-name { font-weight: 800; font-size: 14px; color: #0f2942; }
  .day-name.done { color: #166534; }
  .done-label { font-size: 11px; color: #16a34a; font-weight: 700; }
  .time-badge { font-size: 10px; color: #aaa; background: #f5f3ef; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .task-list { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 7px; }

  .task-item { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; padding: 8px 10px; border-radius: 10px; border: 1.5px solid; transition: all 0.15s; user-select: none; -webkit-user-select: none; }
  .task-item.done { background: #f0fdf4 !important; border-color: #86efac !important; }
  .checkbox { width: 19px; height: 19px; border-radius: 6px; border: 2px solid; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 11px; font-weight: 900; color: #fff; }
  .checkbox.checked { background: #22c55e; border-color: #22c55e !important; }
  .task-body { flex: 1; min-width: 0; }
  .task-meta { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; flex-wrap: wrap; }
  .book-badge { font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 99px; color: #fff; white-space: nowrap; }
  .unit-label { font-size: 10px; color: #888; font-weight: 600; }
  .task-text { font-size: 13px; font-weight: 700; color: #1a1a2e; line-height: 1.45; }
  .task-text.done { font-weight: 400; color: #999; text-decoration: line-through; }

  #guide { margin: 20px 0 0; padding: 16px; background: #fff; border-radius: 14px; border: 1.5px solid #e5e2dc; }
  #guide h3 { font-size: 12px; font-weight: 800; color: #444; margin-bottom: 10px; }
  .cluster-legend { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .cluster-legend-item { font-size: 11px; padding: 6px 10px; border-radius: 8px; }
  #guide p { font-size: 11px; color: #999; line-height: 1.8; }
  #empty { text-align: center; color: #bbb; padding: 48px 0; font-size: 14px; display: none; }
</style>

      { bookId:"sen52", unit:"6단원 평균과 가능성", task:"C단계: 심화·서술형 문제" },
      // 6-1: 쎈 여러 가지 그래프
      { bookId:"sen61", unit:"5단원 여러 가지 그래프", task:"A단계: 띠·원그래프 읽기·그리기" },
      { bookId:"sen61", unit:"5단원 여러 가지 그래프", task:"B단계: 자료 해석 응용" },
      { bookId:"sen61", unit:"5단원 여러 가지 그래프", task:"C단계: 심화·서술형 문제" },
      // 6-1: 에이급 여러 가지 그래프
      { bookId:"aclass61", unit:"5단원 여러 가지 그래프", task:"유형학습: 그래프 핵심 유형" },
      { bookId:"aclass61", unit:"5단원 여러 가지 그래프", task:"심화·최고수준: 자료 해석 고난도" },
    ],
  },
];

// ── 날짜 유틸 ───────────────────────────────────
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(d) { return d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'}); }
function getDayType(d) { const w=d.getDay(); if(w===0) return 'rest'; if(w===1||w===3||w===4) return 'short'; return 'long'; }
const TODAY_YMD = '2026-05-20';

// ── 전체 과제 순서 생성 ─────────────────────────
// 묶음 순서대로 flat하게 이어붙임
function buildAllTasks() {
  const all = [];
  CLUSTERS.forEach(cl => {
    cl.tasks.forEach(t => {
      const info = BOOK_INFO[t.bookId];
      all.push({ ...t, clusterId: cl.id, clusterLabel: cl.label, clusterIcon: cl.icon, clusterColor: cl.color, clusterBgLight: cl.bgLight, bookShort: info.short, color: info.color, bgLight: info.bgLight });
    });
  });
  return all;
}

// ── 스케줄 생성 ─────────────────────────────────
function buildSchedule() {
  const allTasks = buildAllTasks();
  const schedule = [];
  let idx = 0;
  let cur = new Date('2026-05-20');
  const end = new Date('2026-08-19');

  while (cur <= end) {
    const dt = getDayType(cur);
    if (dt !== 'rest') {
      const cnt = dt === 'short' ? 1 : 2;
      const dayTasks = [];
      for (let i = 0; i < cnt && idx < allTasks.length; i++) dayTasks.push(allTasks[idx++]);
      if (dayTasks.length) schedule.push({ date: new Date(cur), dayType: dt, tasks: dayTasks });
    }
    cur = addDays(cur, 1);
  }
  return { schedule, total: allTasks.length };
}

// ── 월별 그룹 ───────────────────────────────────
function groupByMonth(schedule) {
  const map = {};
  schedule.forEach(day => {
    const k = `${day.date.getFullYear()}-${day.date.getMonth()}`;
    if (!map[k]) map[k] = { label: day.date.toLocaleDateString('ko-KR',{year:'numeric',month:'long'}), days:[] };
    map[k].days.push(day);
  });
  return Object.values(map);
}

// ── 상태 ────────────────────────────────────────
const { schedule, total } = buildSchedule();
const months = groupByMonth(schedule);
let completedMap = {};
let activeCluster = 'all';
let activeMonth = 0;

try { const s = localStorage.getItem('mathplan_v3'); if(s) completedMap = JSON.parse(s); } catch(e){}
function saveCompleted() { try { localStorage.setItem('mathplan_v3', JSON.stringify(completedMap)); } catch(e){} }

function updateProgress() {
  const done = Object.values(completedMap).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('progress-text').textContent = `완료 ${done} / ${total}개 과제 (${pct}%)`;
}

function getFilteredMonths() {
  if (activeCluster === 'all') return months;
  return months.map(m => ({
    ...m,
    days: m.days.map(d => ({ ...d, tasks: d.tasks.filter(t => t.clusterId === activeCluster) })).filter(d => d.tasks.length > 0)
  })).filter(m => m.days.length > 0);
}

// ── 범례 렌더 ───────────────────────────────────
function renderLegend() {
  const el = document.getElementById('cluster-legend');
  el.innerHTML = '';
  CLUSTERS.forEach(cl => {
    const div = document.createElement('div');
    div.className = 'cluster-legend-item';
    div.style.background = cl.bgLight;
    div.style.border = `1.5px solid ${cl.color}33`;
    div.style.color = cl.color;
    div.style.fontWeight = '700';
    div.innerHTML = `${cl.icon} <strong>${cl.label}</strong> <span style="font-weight:400;color:#666;font-size:10px;">${cl.tasks.length}개 과제</span>`;
    el.appendChild(div);
  });
}

// ── 메인 렌더 ───────────────────────────────────
function render() {
  const fm = getFilteredMonths();
  const safeMonth = Math.min(activeMonth, Math.max(0, fm.length-1));

  // 묶음 필터 탭
  const ctEl = document.getElementById('cluster-tabs');
  ctEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (activeCluster==='all'?' active':'');
  allBtn.textContent = '전체';
  allBtn.style.borderColor = '#555';
  allBtn.style.color = activeCluster==='all' ? '#fff' : '#555';
  if (activeCluster==='all') allBtn.style.background = '#555';
  allBtn.onclick = () => { activeCluster='all'; activeMonth=0; render(); };
  ctEl.appendChild(allBtn);

  CLUSTERS.forEach(cl => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeCluster===cl.id?' active':'');
    btn.textContent = cl.icon + ' ' + cl.label;
    btn.style.borderColor = cl.color;
    btn.style.color = activeCluster===cl.id ? '#fff' : cl.color;
    if (activeCluster===cl.id) btn.style.background = cl.color;
    btn.onclick = () => { activeCluster=cl.id; activeMonth=0; render(); };
    ctEl.appendChild(btn);
  });

  // 월 탭
  const mtEl = document.getElementById('month-tabs');
  mtEl.innerHTML = '';
  fm.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (safeMonth===i?' active':'');
    btn.textContent = m.label;
    btn.onclick = () => { activeMonth=i; render(); };
    mtEl.appendChild(btn);
  });

  // 날짜 카드
  const dlEl = document.getElementById('day-list');
  const emEl = document.getElementById('empty');
  dlEl.innerHTML = '';
  const days = fm[safeMonth]?.days || [];
  if (!days.length) { emEl.style.display='block'; updateProgress(); return; }
  emEl.style.display='none';

  let lastCluster = null;

  days.forEach(day => {
    const d_ymd = ymd(day.date);
    const isToday = d_ymd === TODAY_YMD;
    const allDone = day.tasks.every((_,i) => completedMap[`${d_ymd}-${i}`]);

    // 묶음 구분 헤더 (전체 보기일 때만)
    if (activeCluster === 'all') {
      const firstCluster = day.tasks[0]?.clusterId;
      if (firstCluster && firstCluster !== lastCluster) {
        lastCluster = firstCluster;
        const cl = CLUSTERS.find(c => c.id === firstCluster);
        if (cl) {
          const hdr = document.createElement('div');
          hdr.className = 'cluster-header';
          hdr.style.background = cl.bgLight;
          hdr.style.border = `1.5px solid ${cl.color}44`;
          hdr.innerHTML = `<span class="cluster-icon">${cl.icon}</span><div><div class="cluster-title" style="color:${cl.color}">${cl.label} 묶음</div><div class="cluster-sub" style="color:${cl.color}">5-1 → 5-2 → 6-1 순서</div></div>`;
          dlEl.appendChild(hdr);
        }
      }
    }

    const card = document.createElement('div');
    card.className = 'day-card'+(allDone?' done':'')+(isToday?' today':'');

    const hdr = document.createElement('div');
    hdr.className = 'day-header'+(isToday?' today-bg':'')+(allDone?' done-border':'');
    hdr.innerHTML = `
      <div class="day-title">
        ${isToday?'<span class="today-badge">TODAY</span>':''}
        <span class="day-name${allDone?' done':''}">${fmtDate(day.date)}</span>
        ${allDone?'<span class="done-label">✓ 완료</span>':''}
      </div>
      <span class="time-badge">${day.dayType==='short'?'⏱ 30~60분':'📖 2시간'}</span>
    `;
    card.appendChild(hdr);

    const tl = document.createElement('div');
    tl.className = 'task-list';
    day.tasks.forEach((task, ti) => {
      const key = `${d_ymd}-${ti}`;
      const done = !!completedMap[key];
      const item = document.createElement('div');
      item.className = 'task-item'+(done?' done':'');
      item.style.background = done ? '#f0fdf4' : task.bgLight;
      item.style.borderColor = done ? '#86efac' : task.color+'44';
      item.innerHTML = `
        <div class="checkbox${done?' checked':''}" style="border-color:${done?'#22c55e':task.color}">${done?'✓':''}</div>
        <div class="task-body">
          <div class="task-meta">
            <span style="font-size:11px;font-weight:800;color:${task.clusterColor};margin-right:2px">${task.clusterIcon}</span>
            <span class="book-badge" style="background:${task.color}">${task.bookShort}</span>
            <span class="unit-label">${task.unit}</span>
          </div>
          <div class="task-text${done?' done':''}">${task.task}</div>
        </div>
      `;
      item.onclick = () => { completedMap[key]=!completedMap[key]; saveCompleted(); updateProgress(); render(); };
      tl.appendChild(item);
    });
    card.appendChild(tl);
    dlEl.appendChild(card);
  });

  updateProgress();
}

renderLegend();
render();
</script>
